[package]
name = "klungo"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }

anyhow = "1.0"
genai = "0.7"
http = "*"
inquire = "0.9"
schemars = "1.2"
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }
ignore = "0.4"
async-result-ext = "0.1.0"
futures = "0.3.34"
regex = "1.13.1"
