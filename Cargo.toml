[package]
name = "blunderbuss"
description = "The non-toxic LLM coding harness. The major LLM coding harnesses are dark patterns all the way down. Blunderbuss is designed as if your safety and cognition actually matter."
keywords = ["llm-harness", "coding-harness", "non-toxic", "safety-first"]
version = "0.1.2"
edition = "2024"
license-file = "LICENSE"
homepage = "https://blainehansen.me/post/blunderbuss/"
repository = "https://github.com/unbreaking-lab/blunderbuss"
exclude = [
	"notes.md",
	"*.sh",
	".editorconfig",
	".gitignore",
]

[[bin]]
name = "blb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }

anyhow = "1.0"
genai = "0.7"
http = "1.5"
inquire = "0.9"
schemars = "1.2"
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }
ignore = "0.4"
async-result-ext = "0.1"
futures = "0.3"
regex = "1.13"
yaml_serde = "0.10"
nom = "8"
nom-language = "0.1"
gray_matter = "0.3"
shlex = "2.0"
