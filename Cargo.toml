[package]
name = "klungo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "klg"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["full"] }

anyhow = "1.0"
genai = "0.7"
http = "*"
inquire = "0.9"
schemars = "1.2"
backon = { version = "1.6", default-features = false, features = ["tokio-sleep"] }
ignore = "0.4"
async-result-ext = "0.1"
futures = "0.3"
regex = "1.13"
yaml_serde = "0.10"
nom = "8"
nom-language = "0.1"
gray_matter = "0.3"
shlex = "2.0"
